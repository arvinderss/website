name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Tailwind CSS
        run: |
          mkdir -p dist/assets
          npm install --no-save --no-package-lock tailwindcss@4 @tailwindcss/cli@4 node-html-parser@7
          npx @tailwindcss/cli -i src/input.css -o dist/assets/styles.css --minify

      - name: Assemble site
        run: |
          cp index.html dist/
          [ -d assets ] && cp -r assets/. dist/assets/ || true
          [ -f CNAME ] && cp CNAME dist/ || true
          touch dist/.nojekyll

      - name: Generate resume PDF from site content
        run: node scripts/build-resume.mjs index.html dist/resume-arvinder-singh.pdf

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
